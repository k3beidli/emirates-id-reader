name: Rust
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Lints
        run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo +stable test --locked --all-features
      - name: Documentation
        run: cargo +stable doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify package
        run: cargo +stable package --locked --all-features
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generated documentation
        run: python scripts/build_wiki.py --check
  msrv:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum Rust version
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check minimum Rust version
        run: cargo +1.85.0 check --locked --all-targets --all-features
