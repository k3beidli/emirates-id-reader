name: Rust
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - name: Formatting
        run: cargo +stable fmt --all -- --check
      - name: Lints
        run: cargo +stable clippy --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo +stable test --locked
      - name: Documentation
        run: cargo +stable doc --locked --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: Verify package
        run: cargo +stable package --locked
