name: Desktop app
on:
  workflow_dispatch:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['examples/desktop/**', 'src/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['examples/desktop/**', 'src/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/desktop.yml']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: examples/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: examples/desktop/package-lock.json
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/desktop/src-tauri -> target
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag must match the app version v$version"
          }
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: cargo +stable fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo +stable test --locked --manifest-path src-tauri/Cargo.toml
      - run: cargo +stable clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: npm run desktop:build -- -- --locked
      - name: Prepare executable
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item src-tauri/target/release/emirates-id-reader-desktop.exe "release/emirates-id-reader-v$version-windows-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: examples/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-x64
          path: release
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            if ! jq -e '.isDraft == true' release-state.json > /dev/null; then
              echo "Refusing to replace assets on a published release."
              exit 1
            fi
          else
            printf '%s\n' 'Windows x64 portable sample app. Run the EXE directly; no installer is needed.' '' 'Requires Microsoft Edge WebView2 Runtime and a PC/SC reader driver. Tested with HID OMNIKEY 3121 on Windows.' > release-notes.md
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release/*.exe --clobber
