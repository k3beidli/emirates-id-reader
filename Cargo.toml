[package]
name = "emirates-id-reader"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "A Rust library for reading data from Emirates ID chips."
license = "MIT"
repository = "https://github.com/k3beidli/emirates-id-reader"
readme = "README.md"
documentation = "https://docs.rs/emirates-id-reader"
keywords = ["emirates-id", "smartcard", "pcsc", "uae", "iso7816"]
categories = ["api-bindings", "hardware-support"]
# Anchor patterns at this package root so nested app READMEs/licenses do not match.
# The negated paths keep companion-app guides out of the SDK archive if those
# pages are added under docs/ or generated into docs/wiki/ in the future.
include = ["/src/**", "/docs/**/*.md", "/docs/media/*.gif", "/examples/**", "/scripts/build_wiki.py", "/CONTRIBUTING.md", "/Cargo.toml", "/README.md", "/CHANGELOG.md", "/LICENSE", "!/docs/sample-app.md", "!/docs/wiki/Sample-App.md"]

[features]
default = []
# Diagnostic utility is opt-in; consumers receive only the library by default.
cli = []

[[bin]]
name = "emirates-id-reader"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
pcsc = "2.9"
serde = { version = "1", features = ["derive"] }

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu", "aarch64-apple-darwin"]
